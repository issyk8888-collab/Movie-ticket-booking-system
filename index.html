<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Ticket Booking ~ Login Page</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="script.js"></script>
</head>
<body background="back.jpg">
    <div class="container">
        <h1>Movie Ticket Booking</h1>
        <div class="auth-container">
            <h2>Login & Register</h2>
            <input type="text" id="user-name" placeholder="Enter your name">
            <input type="email" id="user-email" placeholder="Enter email">
            <input type="password" id="user-password" placeholder="Enter password">
            <button id="register-btn">Register</button>
            <button id="login-btn">Login</button>
            <button id="forgot-pass-btn">Forgot Password?</button>
        </div>
    </div>
</body>
</html>
